name: Customer_Storage
services:
  postgres:
    context: ./backend
    image: postgres:15
    env_file:
      - ./backend/.env
    container_name: cen_cms_pg_image
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:5432" # external:internal
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: cen_cms_adminer
    restart: always
    ports:
      - 8080:8080

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    image: cen_cms_api_image
    container_name: cen_cms_api
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
    ports:
      - "${CEN_CMS_API_PORT}:${CEN_CMS_API_PORT}"
    depends_on:
      - postgres
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
          ignore:
            - node_modules/
            - frontend/
        - action: rebuild
          path: package.json

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    image: cen_cms_web_image
    container_name: cen_cms_web
    restart: always
    ports:
      - "5173:5173"
    working_dir: /usr/src/app
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ../frontend
          target: /usr/src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json

volumes:
  pgdata:
